name: TestFlight release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Measure exact pinned Xcode and SDK
        run: |
          set -euo pipefail
          python3 Scripts/select_xcode.py --toolchain toolchain.json > "$RUNNER_TEMP/developer-dir"
          DEVELOPER_DIR="$(<"$RUNNER_TEMP/developer-dir")"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version
          bash scripts/check_zero_network.sh
          python3 - <<'PY'
          import json
          with open('toolchain.json') as handle:
              policy = json.load(handle)
          assert policy['bundle_identifier'] == 'com.infinityball.dialshot'
          assert policy['targeted_device_family'] == '1'
          assert policy['network_allowlist'] == []
          PY
      - name: Prepare private signing key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 ASC_TEAM_ID; do
            test -n "${!name}" || { printf 'Missing secret: %s\n' "$name" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/asc"
          chmod 700 "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          {
            echo "ASC_KEY_ID_VALUE=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID_VALUE=$ASC_ISSUER_ID"
            echo "ASC_TEAM_ID_VALUE=$ASC_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Archive signed iPhone app
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive -project DialShot.xcodeproj -scheme DialShot \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/DialShot.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_VALUE" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_VALUE" \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID_VALUE" \
            CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/archive.log
          app=build/DialShot.xcarchive/Products/Applications/DialShot.app
          codesign --verify --deep --strict "$app"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          assert info['CFBundleIdentifier'] == 'com.infinityball.dialshot', info['CFBundleIdentifier']
          assert info['UIDeviceFamily'] == [1], info['UIDeviceFamily']
          print('Archived bundle ID and UIDeviceFamily [1]: PASS')
          PY
          test -s "$app/Assets.car"
          # Xcode 26 single-size icons produce raster files even when
          # CFBundleIconName is absent from the archive Info.plist.
          compgen -G "$app/AppIcon*.png" >/dev/null
      - name: Export IPA and upload to TestFlight
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 - "$ASC_TEAM_ID_VALUE" > build/ExportOptions.plist <<'PY'
          import plistlib, sys
          plistlib.dump(dict(method='app-store-connect', signingStyle='automatic',
                             destination='upload', uploadMethod='app-store-connect',
                             manageAppVersionAndBuildNumber=False,
                             teamID=sys.argv[1]), sys.stdout.buffer)
          PY
          xcodebuild -exportArchive -archivePath build/DialShot.xcarchive \
            -exportPath build/export -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID_VALUE" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID_VALUE" \
            2>&1 | tee build/export.log
      - name: Confirm processed TestFlight build
        timeout-minutes: 20
        env:
          ASC_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/asc-venv/bin/python3" Scripts/verify_testflight.py \
            --key "$RUNNER_TEMP/asc/AuthKey.p8" \
            --key-id "$ASC_KEY_ID_VALUE" --issuer-id "$ASC_ISSUER_ID_VALUE" \
            --bundle-id com.infinityball.dialshot --build "$ASC_BUILD_NUMBER"
      - name: Delete signing material
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/asc" ]; then
            rm -f "$RUNNER_TEMP/asc/AuthKey.p8"
          fi
      - name: Upload non-secret release logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-logs-${{ github.run_id }}
          path: |
            build/archive.log
            build/export.log
          if-no-files-found: ignore
          retention-days: 14
